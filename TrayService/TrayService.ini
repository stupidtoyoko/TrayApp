; TEST ONLY. This configuration uses HTTP bound to 127.0.0.1.
; Never enable allow_insecure_loopback_http in a production deployment.
[server]
base_url=http://127.0.0.1:8765
allow_insecure_loopback_http=1

[endpoints]
login=/api/auth/login
refresh=/api/auth/refresh
license_status=/api/license/status
activate=/api/license/activate

[methods]
login=POST
refresh=POST
license_status=POST
activate=POST
