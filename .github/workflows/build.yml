name: Windows CMake Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -S . -B out/build -A x64

      - name: Build Release
        run: cmake --build out/build --config Release

      - name: Upload EXE artifact
        uses: actions/upload-artifact@v4
        with:
          name: TrayApp-windows-x64
          path: out/build/Release/TrayApp.exe
          if-no-files-found: error
